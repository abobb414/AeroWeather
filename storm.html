<!DOCTYPE html>
<html lang="zh-CN" data-ink="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>强对流 · 渲染实验台</title>

<!-- 复用主站字体；取不到就退回系统字体，不影响这页的功能 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   三层渲染 + 一块面板，不引外部样式表。
   weather.css 是为完整报告版式写的，这里只有「背景 + 一块浮层」，
   引进来反而要被它的 .sheet / .colophon 等一堆规则牵制。
   ============================================================ */

:root {
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --sans: 'Inter', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  --serif: 'Fraunces', Georgia, 'Songti SC', serif;
  --ink: #e8ecf4;
  --ink-2: rgba(232, 236, 244, 0.76);
  --ink-3: rgba(232, 236, 244, 0.5);
  --panel: rgba(14, 18, 28, 0.72);
  --panel-line: rgba(255, 255, 255, 0.14);
  --acc: #ffd479;
}

* { box-sizing: border-box; }

/* 关键：html / body 不能有不透明背景。
   .sky-backdrop(-2) 与 .weather-effects(-1) 都是负 z-index，
   负 z-index 的层会被绘制在**根背景之下** —— 一旦给 body 上色，
   那两层就整个被盖掉，画面上只剩玻璃水珠（实测就是这样：纯黑底 + 白点）。
   兜底色交给 .sky-backdrop 自己，JS 跑起来后由 sky-gradient.js 覆盖。 */
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

body {
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  position: relative;
  transition: color 1.1s ease;
}

/* ---------- 三层背景（从后到前） ---------- */

/* ① 天空渐变：sky-gradient.js 往它的 style.background 写 linear-gradient。
   这个内联渐变只是 JS 起来之前的兜底（雷暴夜色），别删。 */
.sky-backdrop {
  position: fixed;
  inset: 0;
  z-index: -2;
  background: linear-gradient(rgb(11, 13, 20) 0%, rgb(22, 25, 34) 52%, rgb(52, 51, 66) 100%);
  /* 换场时渐变跟着一起过渡，避免硬切 */
  transition: background 3s ease;
}

/* 视口边缘 tint 采样条：Safari 26 从「贴边 fixed 元素的 background-color」
   取浏览器工具栏底色，渐变层采样不到 → 白条。两条带专做采样源，颜色等于
   渐变的 top / bot 端点，肉眼无缝。主站对应 css/sky-gradient.css 里的
   .sky-edge-tint，采样门槛（含「高度 >4px、实测 11–12px」）写在那边的注释里。 */
.sky-edge-tint {
  position: fixed;
  left: 0;
  right: 0;
  height: 12px;
  z-index: -1;
  pointer-events: none;
  transition: background-color 3s ease;
}
.sky-edge-top { top: 0; background-color: rgb(11, 13, 20); }
.sky-edge-bottom { bottom: 0; background-color: rgb(52, 51, 66); }

/* ② 窗外世界：雨/雪/闪电 */
.weather-effects {
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
  transition: filter 1.2s ease;
}

/* ③ 玻璃水珠：在内容之上，保持锐利 */
.glass-layer {
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  z-index: 40;
  pointer-events: none;
}

/* ---------- 角标标题 ---------- */

.title {
  position: fixed;
  top: 28px;
  left: 32px;
  z-index: 50;
  pointer-events: none;
}

.title h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: 27px;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.title p {
  margin: 6px 0 0;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* ---------- 面板 ---------- */

.panel {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 50;
  width: 340px;
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  padding: 16px 16px 14px;
  border-radius: 14px;
  border: 1px solid var(--panel-line);
  background: var(--panel);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.46);
  transition: transform 0.36s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
}

body.panel-hidden .panel {
  transform: translateY(calc(100% + 28px));
  opacity: 0;
  pointer-events: none;
}

.panel h2 {
  margin: 0 0 10px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.panel h2 small {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 400;
  color: var(--ink-3);
  letter-spacing: 0.06em;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.row:last-child { margin-bottom: 0; }

button {
  all: unset;
  cursor: pointer;
  font-family: var(--sans);
  font-size: 12px;
  padding: 5px 10px;
  border-radius: 7px;
  border: 1px solid var(--panel-line);
  color: var(--ink-2);
  background: rgba(255, 255, 255, 0.05);
  transition: background 0.18s, color 0.18s, border-color 0.18s;
  white-space: nowrap;
}

button:hover {
  background: rgba(255, 255, 255, 0.12);
  color: var(--ink);
}

button.on {
  background: var(--acc);
  border-color: var(--acc);
  color: #2a1f06;
  font-weight: 600;
}

.lbl {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 0 0 4px;
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
}

.lbl b {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 12px;
  color: var(--ink);
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 3px;
  margin: 0 0 14px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.2);
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--acc);
  cursor: pointer;
  border: 2px solid rgba(14, 18, 28, 0.9);
}

#counter, #fps {
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.6;
  color: var(--ink-3);
}

#counter { margin: 0 0 8px; }

#fps {
  float: right;
  color: var(--acc);
  opacity: 0.8;
}

#readout {
  margin: 10px 0 0;
  padding: 9px 10px;
  border-radius: 9px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.07);
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.55;
  color: var(--ink-2);
  white-space: pre;
  overflow-x: auto;
}

.hint {
  margin: 10px 0 0;
  font-size: 11px;
  line-height: 1.6;
  color: var(--ink-3);
}

.hint kbd {
  font-family: var(--mono);
  font-size: 10px;
  padding: 1px 4px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.1);
}

/* 收起状态下给一个能点回来的小把手 */
.reopen {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 51;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

body.panel-hidden .reopen {
  opacity: 1;
  pointer-events: auto;
}
</style>
</head>
<body>

<div class="sky-backdrop"></div>
<div class="sky-edge-tint sky-edge-top"></div>
<div class="sky-edge-tint sky-edge-bottom"></div>
<canvas class="weather-effects" id="weatherEffects" aria-hidden="true"></canvas>

<div class="title">
  <h1>强对流 · 渲染实验台</h1>
  <p>scene · glass · sky — 独立驱动，不走数据源</p>
</div>

<!-- 玻璃层在内容之上 -->
<canvas class="glass-layer" id="glassLayer" aria-hidden="true"></canvas>

<section class="panel" id="panel">
  <h2>天气 <small id="fps">fps —</small></h2>
  <div class="row" id="sceneBtns"></div>

  <div class="lbl"><span>时刻</span><b id="hourLbl">20:30</b></div>
  <input type="range" id="hour" min="0" max="23.95" step="0.05" value="20.5">

  <div class="row">
    <button id="realtime">跟随真实时间</button>
    <button id="pause">暂停</button>
    <button id="bolt">定格闪电</button>
    <button id="glassOn" class="on">水珠层</button>
    <button id="hide">收起面板</button>
  </div>

  <p id="counter">—</p>
  <pre id="readout">{}</pre>

  <p class="hint">
    雷暴是本页默认场景。「定格闪电」会暂停动画并手工渲染一帧，
    把分叉枝干留在画面里 —— 实时截图基本撞不上那一帧。<br>
    想细看水珠就往左上角看，雨越密玻璃上的水珠越活跃。
  </p>
</section>

<button class="reopen" id="show">显示面板</button>

<script>
  // 面板收起后，用这个把手叫回来（面板本身被 transform 移出视口了）
  document.getElementById('show').addEventListener('click', function () {
    document.body.classList.remove('panel-hidden');
  });
</script>
<script type="module" src="js/storm.js"></script>
</body>
</html>
